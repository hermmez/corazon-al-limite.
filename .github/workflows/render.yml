
name: Renderizar video Remotion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta
        run: mkdir -p out

      - name: Renderizar video
        run: npm run render

      - name: Guardar video MP4
        uses: actions/upload-artifact@v4
        with:
          name: corazon-al-limite-video
          path: out/corazon-al-limite.mp4
          if-no-files-found: error
