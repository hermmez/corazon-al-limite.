name: Renderizar Prueba2D

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:prueba2d
      - run: npm run render:prueba2d -- --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: prueba2d-mp4
          path: out/prueba2d.mp4
          if-no-files-found: error
