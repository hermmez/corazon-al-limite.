name: Renderizar PrimerVideoSueno

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:sueno
      - run: npm run script:sueno
      - run: npm run render:sueno -- --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: primer-video-sueno-90s
          path: |
            out/primer-video-sueno.mp4
            out/primer-video-sueno-subtitulos.srt
            out/primer-video-sueno-guion-es-MX.txt
          if-no-files-found: error
