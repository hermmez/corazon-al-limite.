name: Importar imagen PNG

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "URL HTTPS publica y directa del archivo PNG"
        required: true
        type: string
      filename:
        description: "Nombre final (ejemplo 01_rostro_cansado.png)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: importar-imagenes
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validar y descargar PNG
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          FILENAME: ${{ inputs.filename }}
        run: |
          python3 - <<'PY'
          import os, re, ssl, urllib.parse, urllib.request, ipaddress, socket, struct, pathlib
          url = os.environ["IMAGE_URL"].strip()
          name = os.environ["FILENAME"].strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,79}\.png", name):
              raise SystemExit("Nombre no valido. Usa letras, numeros, guion y extension .png")
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("Se requiere una URL HTTPS publica")
          if parsed.port not in (None, 443):
              raise SystemExit("Solo puerto HTTPS estandar")
          host = parsed.hostname
          if host.lower() in ("localhost",) or host.lower().endswith((".local", ".internal")):
              raise SystemExit("Host no permitido")
          for entry in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM):
              addr = ipaddress.ip_address(entry[4][0])
              if not addr.is_global:
                  raise SystemExit("La URL debe apuntar a una IP publica")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("Redirecciones deshabilitadas; usa la URL final directa")
          opener = urllib.request.build_opener(NoRedirect)
          req = urllib.request.Request(url, headers={"User-Agent": "RemotionPNGImporter/1.0"})
          with opener.open(req, timeout=20) as response:
              data = response.read(15 * 1024 * 1024 + 1)
          if len(data) > 15 * 1024 * 1024:
              raise SystemExit("Archivo supera 15 MB")
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("El archivo no tiene firma PNG valida")
          if len(data) < 33 or data[12:16] != b"IHDR":
              raise SystemExit("PNG incompleto")
          width, height = struct.unpack(">II", data[16:24])
          if width < 1 or height < 1 or width > 8192 or height > 8192:
              raise SystemExit("Dimensiones PNG no permitidas")
          dest = pathlib.Path("public/imagenes/recursos_90s") / name
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(data)
          print(f"Descargado {dest} ({width}x{height}, {len(data)} bytes)")
          PY

      - name: Guardar imagen en GitHub
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "public/imagenes/recursos_90s/$FILENAME"
          if git diff --cached --quiet; then
            echo "La imagen ya existe y no cambio"
          else
            git commit -m "Agregar recurso visual: $FILENAME"
            git push
          fi
